[project]
name = "structure-predictor"
version = "0.1.0"
description = "AlphaFold structure prediction pipeline with confidence analysis and PyMOL visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "biopython>=1.84",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "hatchling>=1.31.0",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling"
